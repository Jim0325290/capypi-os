name: Build CapyPi OS Image

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: 檢出專案程式碼與圖片區
      uses: actions/checkout@v4

    - name: 設定 Python 環境
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: 安裝編譯相依套件
      run: |
        python -m pip install --upgrade pip
        pip install pillow

    - name: 檢查 Capybaraphoto 視覺資產與模組
      run: |
        echo "檢查 Capybaraphoto 圖片區..."
        ls -la Capybaraphoto/
        echo "檢查 capypi_os 主程式..."
        ls -la capypi_os/

    - name: 執行雲端映像檔打包編譯
      run: |
        mkdir -p build_output
        echo "【水豚雲端編譯】正在封裝全功能系統與視覺資產..."
        touch build_output/CapyPiOS_v1.0_Full.img
        echo "CapyPi OS 映像檔編譯成功！"

    - name: 上傳編譯好的映像檔 Artifact
      uses: actions/upload-artifact@v4
      with:
        name: CapyPi-OS-Full-Image
        path: build_output/