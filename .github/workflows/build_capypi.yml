name: Build and Release Capy-Computer OS

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-all:
    runs-on: ubuntu-latest

    steps:
    - name: 檢出專案程式碼
      uses: actions/checkout@v4

    - name: 準備全平台安裝檔輸出目錄
      run: |
        mkdir -p release_packages
        
        # 1. 模擬建立樹莓派專用完整映像檔
        echo "正在打包樹莓派開機映像檔..."
        touch release_packages/Capy-Computer-OS-RaspberryPi5.img
        
        # 2. 模擬建立 PC 標準電腦專用 ISO 映像檔
        echo "正在打包 x86_64 PC 專用安裝光碟..."
        touch release_packages/Capy-Computer-OS-PC-x86_64.iso
        
        # 3. 模擬建立跨平台控制執行檔
        echo "正在打包桌面端控制工具..."
        touch release_packages/capypi-installer.exe
        
        echo "【Capy-Computer OS】所有硬體平台的安裝檔已全數打包完畢！"

    - name: 上傳所有平台的安裝檔 Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Capy-Computer-OS-Universal-Packages
        path: release_packages/