name: Build Capy-Computer Installer

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: 檢出專案程式碼
      uses: actions/checkout@v4

    - name: 設定 Python 環境
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: 安裝打包工具與專案相依套件
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller pillow

    - name: 編譯真實的 capypi-installer.exe
      run: |
        pyinstaller --noconsole --onefile --name capypi-installer main.py

    - name: 準備發布資料夾
      run: |
        mkdir -p release_packages
        copy dist\capypi-installer.exe release_packages\

    - name: 上傳打包好的執行檔
      uses: actions/upload-artifact@v4
      with:
        name: Capy-Computer-Installer
        path: release_packages/