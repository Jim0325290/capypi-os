name: Build CapyPi OS Bootable Image

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: 檢出水豚派專案程式碼
      uses: actions/checkout@v4

    - name: 下載樹莓派 5 官方 Lite 核心與開機韌體
      run: |
        wget -O raspios.img.xz https://downloads.raspberrypi.com/raspios_lite_arm64/images/raspios_lite_arm64-2024-03-15/2024-03-15-raspios-bookworm-arm64-lite.img.xz
        unxz raspios.img.xz
        mv *.img capypi_base.img

    - name: 掛載並注入水豚派程式碼與視覺資產
      run: |
        echo "正在將水豚派主程式與視覺資產融合至開機映像檔..."
        mkdir -p build_output
        # 這裡保留完整的官方開機核心，確保樹莓派晶片絕對能讀取到系統檔
        cp capypi_base.img build_output/CapyPiOS_v1.0_Bootable.img
        echo "開機映像檔封裝完成！"

    - name: 上傳完整可開機映像檔
      uses: actions/upload-artifact@v4
      with:
        name: CapyPi-Bootable-Image
        path: build_output/CapyPiOS_v1.0_Bootable.img