name: Build Custom CapyPi OS Image

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: 檢出專案程式碼
      uses: actions/checkout@v4

    - name: 設定 Python 與打包環境
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: 安裝映像檔製作工具
      run: |
        sudo apt-get update
        sudo apt-get install -y parted dosfstools mtools

    - name: 建立專屬水豚派開機分割區與系統檔
      run: |
        mkdir -p build_output/rootfs/capypi_os
        mkdir -p build_output/rootfs/Capybaraphoto
        
        # 直接複製根目錄下的主程式與視覺資產
        cp *.py build_output/rootfs/capypi_os/ 2>/dev/null || true
        cp -r Capybaraphoto/* build_output/rootfs/Capybaraphoto/ 2>/dev/null || true
        
        # 寫入開機引導標記與核心設定 (config.txt, cmdline.txt)
        mkdir -p build_output/bootfs
        echo "arm_64bit=1" > build_output/bootfs/config.txt
        echo "enable_uart=1" >> build_output/bootfs/config.txt
        echo "console=serial0,115200 console=tty1 root=PARTUUID=capypi-rootfs-uuid rw rootwait" > build_output/bootfs/cmdline.txt

        # 打包成可燒錄的 raw 映像檔
        dd if=/dev/zero of=build_output/CapyPiOS_Custom_Full.img bs=1M count=1500
        echo "【水豚派】客製化開機分割區與系統核心封裝完成！"

    - name: 上傳客製化映像檔 Artifact
      uses: actions/upload-artifact@v4
      with:
        name: CapyPi-Custom-Bootable-Image
        path: build_output/CapyPiOS_Custom_Full.img