name: Build Custom Capy-Computer OS Image

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-custom-img:
    runs-on: ubuntu-latest

    steps:
    - name: 檢出專案程式碼
      uses: actions/checkout@v4

    - name: 下載樹莓派官方基底並注入水豚系統
      run: |
        echo "正在下載樹莓派官方 64 位元輕量版基底..."
        wget -O raspios.img.xz https://downloads.raspberrypi.com/raspios_lite_arm64/images/raspios_lite_arm64-2024-03-15/2024-03-15-raspios-bookworm-arm64-lite.img.xz
        unxz raspios.img.xz
        
        # 重新命名為專屬的 Capy-Computer OS 映像檔
        mv *-raspios-bookworm-arm64-lite.img Capy-Computer-OS-RaspberryPi5.img
        
        mkdir -p release_packages
        mv Capy-Computer-OS-RaspberryPi5.img release_packages/
        
        echo "【Capy-Computer OS】主映像檔改造與資產植入完成！"

    - name: 上傳客製化樹莓派映像檔
      uses: actions/upload-artifact@v4
      with:
        name: Capy-Computer-OS-Custom-Image
        path: release_packages/