name: Build CapyPi OS Image

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pillow

    - name: Verify assets and code
      run: |
        echo "Checking Capybaraphoto..."
        ls -la Capybaraphoto/
        echo "Checking capypi_os..."
        ls -la capypi_os/

    - name: Simulate OS Image Build
      run: |
        mkdir -p build_output
        echo "CapyPi OS Image Built Successfully" > build_output/CapyPiOS_v1.0.img

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: CapyPi-OS-Image
        path: build_output/