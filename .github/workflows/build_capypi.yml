name: Build and Release Capy-Computer OS

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-all:
    runs-on: windows-latest

    steps:
    - name: 檢出專案程式碼
      uses: actions/checkout@v4

    - name: 設定 Python 環境
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: 安裝 PyInstaller 打包工具
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller

    - name: 編譯水豚電腦端控制工具 (capypi-installer.exe)
      run: |
        # 使用 PyInstaller 將主程式打包成單一獨立的 .exe 執行檔
        pyinstaller --noconsole --onefile --name capypi-installer main.py

    - name: 準備發布資料夾
      run: |
        mkdir -p release_packages
        copy dist\capypi-installer.exe release_packages\
        
        # 建立樹莓派開機映像檔佔位 (後續可對應真實基底)
        echo "Capy-Computer OS Raspberry Pi 5 Image" > release_packages\Capy-Computer-OS-RaspberryPi5.txt

    - name: 上傳真實打包好的安裝檔 Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Capy-Computer-OS-Universal-Packages
        path: release_packages/