name: Build CapyPi OS Image

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: # 支援手動點擊按鈕直接觸發編譯

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: 檢出專案程式碼
      uses: actions/checkout@v4

    - name: 設定 Python 環境
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: 安裝編譯與打包相依套件
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller pillow

    - name: 檢查視覺資產與系統結構
      run: |
        echo "檢查 Capybaraphoto 圖片區..."
        ls -la Capybaraphoto/
        echo "檢查主程式與模組..."
        ls -la capypi_os/

    - name: 模擬編譯與打包 CapyPi OS 映像檔
      run: |
        echo "【水豚雲端編譯】正在將系統與 Capybaraphoto 視覺資產封裝..."
        # 這裡未來可擴充為實際產生 .img 映像檔的指令
        mkdir -p build_output
        touch build_output/CapyPiOS_v1.0.img
        echo "CapyPi OS 系統映像檔編譯成功！"

    - name: 上傳編譯好的映像檔作為 Artifact
      uses: actions/upload-artifact@v4
      with:
        name: CapyPi-OS-Image
        path: build_output/